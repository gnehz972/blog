baseURL = 'https://gnehz972.github.io/'
languageCode = 'en-us'
title = 'Blog of gnehz972'
theme = 'hugo-book'

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[params]
  # (Optional) Set this to true to enable 'Last Modified by' date and git author
  #  information on 'doc' type pages.
  enableGitInfo = true

  # (Optional, default none) Set the path to a logo for the book. If the logo is
  # /static/logo.png then the path would be 'logo.png'
#  BookLogo = 'favicon.ico'

  # (Optional, default 'favicon.png') Set the path to a favicon for the site.
  # If the favicon is in /static/custom.svg, then the path would be 'custom.svg'.
  BookFavicon = 'favicon.ico'